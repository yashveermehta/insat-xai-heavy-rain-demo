<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student research prototype for explainable heavy-rain classification using satellite-style features.">
    <meta name="theme-color" content="#f4f5f1">
    <title>{% block title %}XAI Rainfall Prediction{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=6">
    {% block head %}{% endblock %}
</head>
<body>

    <!-- ─── Navbar ─────────────────────────────────────────────────────── -->
    <nav class="navbar" aria-label="Main navigation">
        <a href="/" class="navbar-brand">
            <span class="brand-mark" aria-hidden="true">R</span>
            <span class="brand-name">Rainfall<span class="brand-light">Lab</span></span>
        </a>
        <button class="nav-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open navigation">Menu</button>
        <ul class="nav-links" id="primary-navigation">
            <li><a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Overview</a></li>
            <li><a href="/predict" {% if request.path == '/predict' %}aria-current="page"{% endif %}>Run demo</a></li>
            <li><a href="/dashboard" {% if request.path == '/dashboard' %}aria-current="page"{% endif %}>Evidence</a></li>
            <li><a href="/about" {% if request.path == '/about' %}aria-current="page"{% endif %}>Method &amp; data</a></li>
        </ul>
    </nav>

    <!-- ─── Main Content ───────────────────────────────────────────────── -->
    <main class="container">
        <div class="prototype-banner" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span><strong>Prototype</strong> <span class="banner-divider">/</span> Simulated demonstration data</span>
            <a href="/about">See scope and limitations</a>
        </div>
        {% block content %}{% endblock %}
    </main>

    <!-- ─── Footer ─────────────────────────────────────────────────────── -->
    <footer class="footer">
        <p>Rainfall Lab &copy; 2026 &mdash; Explainable AI Major Project Prototype</p>
    </footer>

    {% block scripts %}{% endblock %}
    <script>
    (() => {
        const button = document.querySelector('.nav-toggle');
        const navigation = document.getElementById('primary-navigation');
        if (!button || !navigation) return;
        button.addEventListener('click', () => {
            const isOpen = navigation.classList.toggle('open');
            button.setAttribute('aria-expanded', String(isOpen));
            button.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
        });
    })();
    </script>
</body>
</html>
